name: Check Upstream Updates
on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    name: Detect upstream changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Required before any commit. Without it the merge path died with
      # `fatal: empty ident name (for <runner@...>) not allowed`. Every sync is
      # a non-fast-forward merge, so this is needed on the clean path too, not
      # just for conflicts.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zalando/spilo.git
          git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/master --count)
          echo "commits_behind=${BEHIND}" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            git log HEAD..upstream/master --oneline > /tmp/upstream-commits.txt
            git diff HEAD..upstream/master --stat -- postgres-appliance/ > /tmp/upstream-diff.txt
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.check.outputs.commits_behind }}
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          if git merge upstream/master -m "chore: sync with upstream ($BEHIND commits)"; then
            echo "Clean merge"
          else
            echo "Conflicts detected — likely README.md"
            git checkout --ours README.md
            git add README.md

            # The README.md step above resolves nothing unless README.md is
            # actually one of the conflicted paths. When anything else
            # conflicts, `git commit` used to run on an unresolved index and
            # fail with a confusing error. Stop here instead and let a human
            # do the merge.
            UNRESOLVED=$(git diff --name-only --diff-filter=U)
            if [ -n "$UNRESOLVED" ]; then
              echo "::error::Upstream merge has conflicts that need a manual merge:"
              echo "$UNRESOLVED"
              git merge --abort
              exit 1
            fi

            git commit -m "chore: sync with upstream ($BEHIND commits)

          Conflicts in README.md resolved in favor of our version. Manual review needed."
          fi

          # Upstream's CI must never run in this org. Their workflow files are
          # absent here, so a sync brings them in as a clean ADD — they never
          # surface as a conflict and the block above never sees them. Drop
          # anything under .github/ that is not one of ours. Listing what we
          # own rather than what they have also covers workflows upstream adds
          # later; naming their current three would not.
          OURS=" .github/workflows/build-push.yaml .github/workflows/pr-build.yaml .github/workflows/renovate.yml .github/workflows/sync-upstream.yaml .github/workflows/trivy-scheduled.yaml "

          DROPPED=""
          for f in $(git ls-files .github/); do
            case "$OURS" in
              *" $f "*) ;;
              *) git rm -q -- "$f"; DROPPED="$DROPPED $f" ;;
            esac
          done

          if [ -n "$DROPPED" ]; then
            echo "Dropped upstream CI pulled in by this sync:$DROPPED"
            git commit -q -m "chore: drop upstream CI pulled in by the sync"
          fi

          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync with upstream ($BEHIND commits)" \
            --body "$(cat <<EOF
          ## Upstream Sync — Merge from zalando/spilo

          **$BEHIND new commits** from [zalando/spilo@master](https://github.com/zalando/spilo/commits/master).

          ### Upstream commits:
          \`\`\`
          $(cat /tmp/upstream-commits.txt)
          \`\`\`

          ### Files changed in postgres-appliance/:
          \`\`\`
          $(cat /tmp/upstream-diff.txt)
          \`\`\`

          ### Merge strategy
          - \`postgres-appliance/\` files — merged from upstream (review for CVE-relevant changes)
          - \`README.md\` — kept our version (manual review needed)
          - CI/CD files (\`.github/\`, \`renovate.json\`, \`.trivyignore\`) — untouched

          ### Post-merge checklist
          - [ ] Review \`postgres-appliance/\` diffs for CVE fixes and breaking changes
          - [ ] If Dockerfile build args changed, update \`renovate.json\`
          - [ ] CI passes (build workflow runs on this PR)
          - [ ] Merge when ready, or cherry-pick specific commits
          EOF
          )" \
            --base main \
            --head "$BRANCH"