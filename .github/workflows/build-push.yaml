name: Build and Publish Spilo Images
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      pgversion:
        description: 'PostgreSQL version to build (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '16'
          - '17'
          - '18'
      multiarch:
        description: 'Build multi-arch images (amd64 + arm64)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: runwhen-contrib

jobs:
  # --- Derive image metadata ---
  derive:
    name: Derive build metadata
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      platforms: ${{ steps.meta.outputs.platforms }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine build matrix and metadata
        id: meta
        run: |
          PATRONIVERSION=$(sed -n 's/^ENV PATRONIVERSION=\([0-9.]*\).*$/\1/p' postgres-appliance/Dockerfile)

          build_matrix() {
            local pg=$1 olds=$2
            printf '{"pgversion":"%s","pgoldversions":"%s"}' "$pg" "$olds"
          }

          if [[ "${{ inputs.pgversion }}" == "all" || -z "${{ inputs.pgversion }}" ]]; then
            ENTRIES="$(build_matrix 16 ''),$(build_matrix 17 16),$(build_matrix 18 '16 17')"
          else
            PG="${{ inputs.pgversion }}"
            case "$PG" in 18) OLDS="16 17" ;; 17) OLDS="16" ;; *) OLDS="" ;; esac
            ENTRIES="$(build_matrix "$PG" "$OLDS")"
          fi

          MATRIX="{\"include\":[${ENTRIES}]}"
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "patroni_version=${PATRONIVERSION}" >> $GITHUB_OUTPUT
          echo "sha_short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          
          # Platform selection: amd64 only by default, multi-arch when explicitly enabled
          if [[ "${{ inputs.multiarch }}" == "true" ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          else
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT

  # --- Build & test (amd64 only, one per PG version) ---
  build-test:
    name: Build & test PG ${{ matrix.pgversion }}
    runs-on: ubuntu-22.04
    needs: derive
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.derive.outputs.matrix) }}
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install docker-compose (for tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-v2 2>/dev/null || true
          # Fallback: create wrapper that calls 'docker compose'
          if ! command -v docker-compose &>/dev/null; then
            sudo tee /usr/local/bin/docker-compose <<'EOF' >/dev/null
          #!/bin/bash
          exec docker compose "$@"
          EOF
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute test PGOLDVERSIONS
        id: test-olds
        run: |
          ALL="14 15 16 17 18"
          OLDS=$(echo "$ALL" | tr ' ' '\n' | grep -v "^${{ matrix.pgversion }}$" | tr '\n' ' ' | xargs)
          echo "pgoldversions=${OLDS}" >> $GITHUB_OUTPUT

      - name: Build and load for testing
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:test
          build-args: |
            PGVERSION=${{ matrix.pgversion }}
            PGOLDVERSIONS=${{ steps.test-olds.outputs.pgoldversions }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test spilo docker image
        id: test
        env:
          SPILO_TEST_IMAGE: "${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:test"
        run: |
          bash postgres-appliance/tests/test_spilo.sh

      - name: Prepare push tag reference
        id: build
        run: |
          echo "image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:test" >> $GITHUB_OUTPUT

  # --- Build & push multi-arch (one per PG version, only on tag/main) ---
  push-multiarch:
    name: Push PG ${{ matrix.pgversion }}
    runs-on: ubuntu-22.04
    needs: [derive, build-test]
    if: github.ref_type == 'tag' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.derive.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: needs.derive.outputs.platforms == 'linux/amd64,linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:${{ needs.derive.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:latest
          platforms: ${{ needs.derive.outputs.platforms }}
          build-args: |
            PGVERSION=${{ matrix.pgversion }}
            PGOLDVERSIONS=${{ matrix.pgoldversions }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Annotate pushed tags
        run: |
          SHA="${{ needs.derive.outputs.sha_short }}"
          PG="${{ matrix.pgversion }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${PG}"
          {
            echo "### Pushed spilo-${PG}"
            echo ""
            echo "\`\`\`"
            echo "docker pull ${IMAGE}:${SHA}"
            echo "docker pull ${IMAGE}:latest"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY

  # --- Trivy image scan (after push) ---
  scan-image:
    name: Trivy scan PG ${{ matrix.pgversion }}
    runs-on: ubuntu-22.04
    needs: [derive, push-multiarch]
    if: always() && needs.push-multiarch.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.derive.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image
        id: scan
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:${{ needs.derive.outputs.sha_short }}"
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --format json "$IMAGE" > trivy-results.json

      - name: Generate markdown report
        id: report
        run: |
          jq -r '
            [.Results[]?.Vulnerabilities[]? // empty]
            | group_by(.VulnerabilityID)
            | map(.[0])
            | sort_by(.Severity, .PkgName)
            | (["| Package | CVE | Installed | Fixed | Severity |",
               "|---------|-----|-----------|-------|----------|"]),
              (.[] | "| \(.PkgName) | [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Severity) |")
          ' trivy-results.json > trivy-report-${{ matrix.pgversion }}.md

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-spilo-${{ matrix.pgversion }}
          path: |
            trivy-results.json
            trivy-report-${{ matrix.pgversion }}.md

  # --- Tag management ---
  tag-release:
    name: Tag release
    runs-on: ubuntu-22.04
    needs: [derive, push-multiarch]
    if: github.ref_type == 'tag' && needs.push-multiarch.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Apply version tags to images
        run: |
          TAG="${{ github.ref_name }}"
          PATRONIVERSION="${{ needs.derive.outputs.patroni_version }}"

          for PG in 16 17 18; do
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${PG}"
            docker pull "${IMAGE}:latest"
            docker tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
            docker push "${IMAGE}:${TAG}"
          done
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

  # --- Notify on failure ---
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-22.04
    needs: [push-multiarch, scan-image]
    if: always() && (needs.push-multiarch.result == 'failure' || needs.scan-image.result == 'failure')
    steps:
      - name: Log failure
        run: |
          echo "Build or scan failed"
          echo "Push result: ${{ needs.push-multiarch.result }}"
          echo "Scan result: ${{ needs.scan-image.result }}"