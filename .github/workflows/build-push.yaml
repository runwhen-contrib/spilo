name: Build and Publish Spilo Images
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      pgversion:
        description: 'PostgreSQL version to build'
        required: false
        default: '18'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: runwhen-contrib

jobs:
  # --- Derive image metadata ---
  derive:
    name: Derive image name and tags
    runs-on: ubuntu-22.04
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      tags: ${{ steps.meta.outputs.tags }}
      pgversion: ${{ steps.meta.outputs.pgversion }}
      patroni_version: ${{ steps.meta.outputs.patroni_version }}
    steps:
      - uses: actions/checkout@v4
        with:
        with:

      - name: Extract build metadata
        id: meta
        run: |
          PGVERSION=$(sed -n 's/^ARG PGVERSION=\([1-9][0-9]*\).*$/\1/p' spilo-upstream/postgres-appliance/Dockerfile)
          PATRONIVERSION=$(sed -n 's/^ENV PATRONIVERSION=\([0-9.]*\).*$/\1/p' spilo-upstream/postgres-appliance/Dockerfile)

          # Use input PGVERSION if provided via workflow_dispatch
          if [[ -n "${{ inputs.pgversion }}" ]]; then
            PGVERSION="${{ inputs.pgversion }}"
          fi

          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${PGVERSION}"

          # Tag strategy:
          #   On tag push:    use the tag itself + patroni version
          #   On main push:   use patroni version + 'latest'
          #   On dispatch:    use patroni version + 'latest'
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            TAGS="${IMAGE_NAME}:${TAG},${IMAGE_NAME}:${PATRONIVERSION}"
          else
            TAGS="${IMAGE_NAME}:${PATRONIVERSION},${IMAGE_NAME}:latest"
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "pgversion=${PGVERSION}" >> $GITHUB_OUTPUT
          echo "patroni_version=${PATRONIVERSION}" >> $GITHUB_OUTPUT

  # --- Build & test (amd64 only, for speed) ---
  build-test:
    name: Build and test (amd64)
    runs-on: ubuntu-22.04
    needs: derive
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load for testing
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          load: true
          tags: ${{ needs.derive.outputs.image_name }}:test
          build-args: |
            PGVERSION=${{ needs.derive.outputs.pgversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test spilo docker image
        id: test
        env:
          SPILO_TEST_IMAGE: "${{ needs.derive.outputs.image_name }}:test"
        run: |
          bash postgres-appliance/tests/test_spilo.sh

      - name: Prepare push tags
        id: build
        run: |
          echo "image_tag=${{ needs.derive.outputs.image_name }}:test" >> $GITHUB_OUTPUT

  # --- Build & push multi-arch (only on tag or main) ---
  push-multiarch:
    name: Push multi-arch image
    runs-on: ubuntu-22.04
    needs: [derive, build-test]
    if: github.ref_type == 'tag' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          push: true
          tags: ${{ needs.derive.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            PGVERSION=${{ needs.derive.outputs.pgversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Trivy image scan (after push, only on main/tag) ---
  scan-image:
    name: Trivy image scan
    runs-on: ubuntu-22.04
    needs: push-multiarch
    if: always() && needs.push-multiarch.result == 'success'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner on built image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ needs.derive.outputs.image_name }}:${{ needs.derive.outputs.patroni_version }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

  # --- Notify on failure ---
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-22.04
    needs: [push-multiarch, scan-image]
    if: always() && (needs.push-multiarch.result == 'failure' || needs.scan-image.result == 'failure')
    steps:
      - name: Log failure
        run: |
          echo "Build or scan failed for ${{ needs.derive.outputs.image_name }}"
          echo "Push result: ${{ needs.push-multiarch.result }}"
          echo "Scan result: ${{ needs.scan-image.result }}"