name: Scheduled Trivy Image Scan
on:
  schedule:
    # Run weekly on Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific image tag to scan (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: runwhen-contrib

jobs:
  scan:
    name: Trivy image vulnerability scan
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pgversion: ['16', '17', '18']
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:${{ inputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-spilo-${{ matrix.pgversion }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-spilo-${{ matrix.pgversion }}-results.sarif'
          category: 'trivy-spilo-${{ matrix.pgversion }}'