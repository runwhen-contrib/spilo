name: Scheduled Trivy Image Scan
on:
  schedule:
    # Run weekly on Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific image tag to scan (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: runwhen-contrib

jobs:
  scan:
    name: Trivy image vulnerability scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pgversion: ['16', '17', '18']
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image
        id: scan
        run: |
          TAG="${{ inputs.image_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${{ matrix.pgversion }}:$TAG"
          echo "Scanning $IMAGE..."
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --format json "$IMAGE" > "trivy-${{ matrix.pgversion }}.json"

      - name: Generate markdown report
        run: |
          jq -r '
            [.Results[]?.Vulnerabilities[]? // empty]
            | group_by(.VulnerabilityID)
            | map(.[0])
            | sort_by(.Severity, .PkgName)
            | (["| Package | CVE | Installed | Fixed | Severity |",
               "|---------|-----|-----------|-------|----------|"]),
              (.[] | "| \(.PkgName) | [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Severity) |")
          ' "trivy-${{ matrix.pgversion }}.json" > "trivy-report-${{ matrix.pgversion }}.md"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scheduled-spilo-${{ matrix.pgversion }}
          path: |
            trivy-${{ matrix.pgversion }}.json
            trivy-report-${{ matrix.pgversion }}.md
