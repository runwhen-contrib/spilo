name: PR Build and Scan
on:
  pull_request:
    branches:
      - main
    paths:
      - 'postgres-appliance/**'
      - '.github/workflows/pr-build.yaml'
      - '.github/workflows/build-push.yaml'
      - 'renovate.json'

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: runwhen-contrib

jobs:
  # --- Filesystem Trivy scan (runs first, fast) ---
  scan-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan repository
        id: scan
        run: |
          trivy fs --severity CRITICAL,HIGH --scanners vuln --format json postgres-appliance/ > trivy-fs-results.json

      - name: Generate markdown report
        run: |
          jq -r '
            [.Results[]?.Vulnerabilities[]? // empty]
            | group_by(.VulnerabilityID)
            | map(.[0])
            | sort_by(.Severity, .PkgName)
            | (["| File | Package | CVE | Severity |",
               "|------|---------|-----|----------|"]),
              (.[] | "| \(.Target) | \(.PkgName) | [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.Severity) |")
          ' trivy-fs-results.json > trivy-fs-report.md

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan
          path: |
            trivy-fs-results.json
            trivy-fs-report.md

  # --- Derive image metadata ---
  derive:
    name: Derive image name
    runs-on: ubuntu-22.04
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      pgversion: ${{ steps.meta.outputs.pgversion }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract build metadata
        id: meta
        run: |
          PGVERSION=$(sed -n 's/^ARG PGVERSION=\([1-9][0-9]*\).*$/\1/p' postgres-appliance/Dockerfile)

          PR_NUM="${{ github.event.pull_request.number }}"
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/spilo-${PGVERSION}:pr-${PR_NUM}-${SHA_SHORT}"

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "pgversion=${PGVERSION}" >> $GITHUB_OUTPUT

  # --- Build & test (amd64 only, for speed) ---
  build-test:
    name: Build and test
    runs-on: ubuntu-22.04
    needs: [scan-fs, derive]
    steps:
      - uses: actions/checkout@v5

      - name: Install docker-compose (for tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-v2 2>/dev/null || true
          if ! command -v docker-compose &>/dev/null; then
            sudo tee /usr/local/bin/docker-compose <<'EOF' >/dev/null
          #!/bin/bash
          exec docker compose "$@"
          EOF
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64 for testing)
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          load: true
          tags: ${{ needs.derive.outputs.image_name }}
          build-args: |
            PGVERSION=${{ needs.derive.outputs.pgversion }}
            PGOLDVERSIONS=14 15 16 17
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test spilo image
        env:
          SPILO_TEST_IMAGE: "${{ needs.derive.outputs.image_name }}"
        run: |
          bash postgres-appliance/tests/test_spilo.sh